name: yolo_mp_gpu
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12.9
  - pip
  - pip:
    # ---------------------------------------------------------------
    # 基盤バイナリのロック (numpy 2.x の侵入を防止)
    # MediaPipe の C-API 要件を満たすため最初に解決すること
    # ---------------------------------------------------------------
    - numpy==1.26.4
    - protobuf==4.25.6

    # ---------------------------------------------------------------
    # GPU最適化PyTorchのバインド (公式CUDAインデックス経由)
    # CUDA 13.0 対応バイナリ。CUDA 12.6 の場合は cu126 に変更すること。
    # ---------------------------------------------------------------
    - --extra-index-url https://download.pytorch.org/whl/cu130
    - torch==2.12.0+cu130
    - torchvision==0.27.0+cu130

    # ---------------------------------------------------------------
    # ビジョン・推論フレームワーク
    # opencv-python と opencv-contrib-python の共存を禁止
    # ---------------------------------------------------------------
    - opencv-contrib-python==4.11.0.86
    - mediapipe==0.10.21
    - ultralytics==8.3.100
